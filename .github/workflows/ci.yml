name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests evals
      - name: Unit + API tests
        run: pytest -q --cov=underwriteiq --cov-report=term-missing
      - name: Memo faithfulness eval (template backend)
        run: python evals/memo_eval.py --n 300
      - name: Pipeline smoke run
        env:
          UNDERWRITEIQ_DB: /tmp/ci.db
        run: |
          uwiq ingest --n 1000
          uwiq report
          uwiq simulate --n 1000 --set GL-003.value=10000000
          python -m underwriteiq.pipeline data/samples/submission_bluebird_clean.json
